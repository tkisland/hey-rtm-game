<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=RocknRoll+One&amp;display=swap" rel="stylesheet" />
  <link rel="canonical" href="https://hey.jpn.org/rhythm/rankings.html" />
  <meta name="description" content="HEY! RHYTHM!の曲・難易度別スコアランキング。" />
  <title>ランキング — HEY! RHYTHM!</title>
</head>
<body class="menu-page ranking-page">
  <div id="app">
    <header class="header"><a class="wordmark" href="./">HEY! <span>RHYTHM!</span><i>✦</i></a><a href="./">選曲へ</a></header>
    <main class="panel">
      <h1>ランキング</h1>
      <p class="ranking-note">曲・難易度・現在の譜面ごとの上位20件です。同じ名前でも別のプレイ記録として表示します。</p>
      <div class="ranking-filters">
        <label>曲<select id="ranking-song"></select></label>
        <label>難易度<select id="ranking-difficulty"></select></label>
        <button id="ranking-refresh" class="text-button" type="button">更新</button>
      </div>
      <p id="ranking-page-status" class="ranking-status" role="status"></p>
      <ol id="ranking-page-entries" class="ranking-entries" aria-label="選択した譜面のランキング"></ol>
      <a id="ranking-play" class="restart-button ranking-open" hidden>この譜面で遊ぶ</a>
    </main>
  </div>
  <script type="module" src="/src/rankings.ts"></script>
</body>
</html>
