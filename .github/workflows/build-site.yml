name: Build site for Sakura FTP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test game logic
        run: npm test
      - name: Set up Java for Firestore rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore permissions
        run: npx --yes firebase-tools@15.34.0 emulators:exec --project demo-hey-rtm --only firestore "npm run test:rules"
      - name: Build static site
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
      - name: Install browser for subdirectory checks
        run: npx playwright install --with-deps chromium
      - name: Check difficulty selection, replay, demonstrations and sharing
        run: npm run test:public -- tests/public/difficulties.spec.ts tests/public/demo-play.spec.ts tests/public/result-share.spec.ts tests/public/security-headers.spec.ts
      - name: Check administrator moderation UI with isolated Firebase
        run: npx --yes firebase-tools@15.34.0 emulators:exec --project demo-hey-rtm --only auth,firestore "npm run test:cloud -- tests/cloud/moderation.spec.ts"
      - name: Check FTP output under /rhythm/
        run: npm run test:sakura
      - name: Check Apache security headers
        run: npm run test:headers
      - name: Check score breakdown, replay and slide releases
        run: npm run test:e2e -- tests/browser/scoring.spec.ts tests/browser/smg-slide-tail.spec.ts
      - name: Test ranking with isolated PHP and MySQL
        run: npm run test:ranking
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-details
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload FTP site package
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-site
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload database setup templates
        uses: actions/upload-artifact@v4
        with:
          name: ranking-setup
          path: server/setup
          if-no-files-found: error
          retention-days: 30
